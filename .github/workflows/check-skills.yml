# Read by `intent stale`: below 3 it adds a workflow-advisory item to every
# review body, opening a PR on every run.
# intent-workflow-version: 3

name: Check Skills

on:
  pull_request:
    paths:
      - 'skills/**'
      - '**/skills/**'
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/**'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    name: Validate intent skills
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate skills
        run: bunx @tanstack/intent validate --github-summary

  review:
    name: Check intent skill coverage
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check skills
        id: stale
        env:
          PACKAGE_LABEL: '@railnetorg/railnet-sdk'
        run: bunx @tanstack/intent stale --github-review --package-label "$PACKAGE_LABEL"

      - name: Open or update review PR
        if: steps.stale.outputs.has_review == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          VERSION="${RELEASE_TAG:-manual}"
          BRANCH="skills/review-${VERSION}"

          PR_URL="$(gh pr list --head "$BRANCH" --json url --jq '.[0].url')"
          if [ -n "$PR_URL" ]; then
            gh pr edit "$PR_URL" --body-file pr-body.md
            echo "Refreshed existing review PR: $PR_URL"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git commit --allow-empty -m "chore: review intent skills for ${VERSION}"
          git push --force origin "$BRANCH"

          gh pr create \
            --title "Review intent skills (${VERSION})" \
            --body-file pr-body.md \
            --head "$BRANCH" \
            --base "$BASE_BRANCH"
