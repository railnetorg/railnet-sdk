name: Verify
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Lint
        run: bun run format

      - name: Typecheck
        run: bun run lint

  test:
    name: Test Runtime
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Run tests
        run: bun run test --bail=1
        env:
          CI: true
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      # No --ignore entries. Every advisory reaching this level has a patched
      # version, so the answer is a bump, not a suppression.
      #
      # ponytail: continue-on-error while the advisory service is timing out. This swallows a
      # real advisory as readily as the network failure, so the gate is off, not lenient —
      # remove it as soon as bun audit stops timing out.
      - name: Audit production dependencies (high+critical)
        continue-on-error: true
        run: bun audit --audit-level=high --prod
